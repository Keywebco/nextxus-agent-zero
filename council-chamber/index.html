<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus Council — Federation Deliberation Chamber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ========== RESET & BASE ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:#07060e;color:#e8e8f0;
  min-height:100vh;overflow-x:hidden;position:relative;
}

/* ========== GOTHIC CATHEDRAL BACKGROUND ========== */
.cathedral-bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:
    /* Central dark void */
    radial-gradient(ellipse 50% 70% at 50% 40%,#0c0a18 0%,transparent 100%),
    /* Stained glass left */
    radial-gradient(ellipse 35% 80% at 0% 40%,rgba(45,27,105,0.45) 0%,transparent 70%),
    /* Stained glass right */
    radial-gradient(ellipse 35% 80% at 100% 40%,rgba(45,27,105,0.45) 0%,transparent 70%),
    /* Floor glow */
    radial-gradient(ellipse 40% 25% at 50% 100%,rgba(0,212,255,0.06) 0%,transparent 70%),
    #07060e;
}
/* Tall arched window pillars — left */
.cathedral-bg::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:60px;
  background:
    linear-gradient(to right,
      rgba(45,27,105,0.3) 0%,rgba(139,92,246,0.08) 40%,transparent 100%);
  border-right:1px solid rgba(139,92,246,0.1);
}
/* Tall arched window pillars — right */
.cathedral-bg::after{
  content:'';position:absolute;right:0;top:0;bottom:0;width:60px;
  background:
    linear-gradient(to left,
      rgba(45,27,105,0.3) 0%,rgba(139,92,246,0.08) 40%,transparent 100%);
  border-left:1px solid rgba(139,92,246,0.1);
}

/* Secondary arch pillars */
.pillar{
  position:fixed;top:0;bottom:0;width:3px;z-index:0;pointer-events:none;
  opacity:0.12;
}
.pillar::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to top,transparent 10%,rgba(139,92,246,0.6) 50%,transparent 90%);
}
.pillar.p1{left:8%}.pillar.p2{left:16%}.pillar.p3{right:8%}.pillar.p4{right:16%}

/* Amber side glow bars */
.side-glow{
  position:fixed;top:10%;width:4px;z-index:0;pointer-events:none;
  border-radius:2px;
}
.side-glow.left{left:3%;height:60%;background:linear-gradient(to top,transparent,rgba(255,140,0,0.2) 30%,rgba(139,92,246,0.2) 70%,transparent);box-shadow:0 0 20px rgba(255,140,0,0.1)}
.side-glow.right{right:3%;height:60%;background:linear-gradient(to top,transparent,rgba(139,92,246,0.2) 30%,rgba(255,140,0,0.2) 70%,transparent);box-shadow:0 0 20px rgba(139,92,246,0.1)}

/* Ember particles */
.embers{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.ember{position:absolute;width:2px;height:2px;border-radius:50%;background:#ff8c00;opacity:0;animation:ember-rise linear infinite}
@keyframes ember-rise{0%{opacity:0;transform:translateY(0) translateX(0)}10%{opacity:0.7}50%{opacity:0.35}100%{opacity:0;transform:translateY(-100vh) translateX(var(--drift))}}
.ember:nth-child(1){left:10%;bottom:-5%;animation-duration:8s;animation-delay:0s;--drift:15px}
.ember:nth-child(2){left:22%;bottom:-3%;animation-duration:11s;animation-delay:2s;--drift:-20px}
.ember:nth-child(3){left:45%;bottom:-6%;animation-duration:9s;animation-delay:1s;--drift:10px}
.ember:nth-child(4){left:60%;bottom:-4%;animation-duration:10s;animation-delay:3s;--drift:-12px}
.ember:nth-child(5){left:78%;bottom:-5%;animation-duration:7s;animation-delay:0.5s;--drift:18px}
.ember:nth-child(6){left:88%;bottom:-3%;animation-duration:12s;animation-delay:4s;--drift:-8px}
.ember:nth-child(7){left:35%;bottom:-7%;animation-duration:9.5s;animation-delay:5s;--drift:22px}
.ember:nth-child(8){left:55%;bottom:-2%;animation-duration:8.5s;animation-delay:1.5s;--drift:-15px}

/* ========== MAIN LAYOUT: 3 LAYERS ========== */
.app-wrap{
  position:relative;z-index:5;
  display:flex;flex-direction:column;
  min-height:100vh;
}

/* ========== SETTINGS GEAR ========== */
.settings-toggle{
  position:fixed;top:0.8rem;right:0.8rem;z-index:100;
  background:rgba(13,17,23,0.7);border:1px solid rgba(139,92,246,0.2);
  color:#e8e8f0;font-size:1.3rem;padding:0.35rem 0.55rem;
  border-radius:8px;cursor:pointer;transition:all 0.3s;backdrop-filter:blur(4px);
}
.settings-toggle:hover{border-color:#00d4ff;color:#00d4ff}

.settings-panel{
  position:fixed;top:0;right:-400px;z-index:200;
  width:370px;max-width:92vw;height:100vh;
  background:rgba(10,10,18,0.97);border-left:1px solid rgba(139,92,246,0.2);
  padding:1.8rem 1.4rem;overflow-y:auto;
  transition:right 0.35s ease;
  box-shadow:-10px 0 50px rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
}
.settings-panel.open{right:0}
.settings-panel h2{font-size:1rem;color:#ffd700;margin-bottom:1.5rem;display:flex;align-items:center;gap:0.5rem}
.settings-close{margin-left:auto;background:none;border:none;color:#e8e8f0;font-size:1.2rem;cursor:pointer;opacity:0.6}
.settings-close:hover{opacity:1}
.setting-group{margin-bottom:1.1rem}
.setting-group label{display:block;font-size:0.7rem;font-weight:500;color:#9a8ec0;margin-bottom:0.35rem;letter-spacing:0.06em;text-transform:uppercase}
.setting-group input[type="password"],.setting-group input[type="number"],.setting-group input[type="text"]{
  width:100%;padding:0.45rem 0.6rem;background:#12101e;border:1px solid rgba(139,92,246,0.2);
  border-radius:6px;color:#e8e8f0;font-family:'Inter',sans-serif;font-size:0.82rem;
}
.setting-group input:focus{outline:none;border-color:#00d4ff}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:0.45rem 0}
.toggle-row span{font-size:0.8rem;color:#b8b0d0}
.toggle-switch{position:relative;width:42px;height:22px;cursor:pointer}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:#1e1a30;border-radius:11px;transition:background 0.3s}
.toggle-slider::before{content:'';position:absolute;left:2px;top:2px;width:18px;height:18px;background:#e8e8f0;border-radius:50%;transition:transform 0.3s}
.toggle-switch input:checked+.toggle-slider{background:#00d4ff}
.toggle-switch input:checked+.toggle-slider::before{transform:translateX(20px)}
.settings-overlay{position:fixed;inset:0;z-index:199;background:rgba(0,0,0,0.5);display:none}
.settings-overlay.open{display:block}

/* ========================================
   LAYER 1: HOLOGRAPHIC DISPLAY (TOP)
   ======================================== */
.holo-display{
  flex-shrink:0;
  padding:1rem 1.5rem 0.8rem;
  display:flex;flex-direction:column;align-items:center;
}
.holo-screen{
  position:relative;
  width:min(90vw,900px);
  min-height:180px;
  background:rgba(12,10,28,0.6);
  border:1px solid rgba(0,212,255,0.15);
  border-radius:14px;
  overflow:hidden;
  backdrop-filter:blur(8px);
  box-shadow:
    0 0 40px rgba(0,212,255,0.07),
    0 0 80px rgba(45,27,105,0.15),
    inset 0 0 60px rgba(0,212,255,0.04);
  display:flex;align-items:center;justify-content:center;
}
/* Audio visualizer bars — left */
.viz-bars{
  position:absolute;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:3px;
  opacity:0.4;
}
.viz-bars.left{left:14px}
.viz-bars.right{right:14px}
.viz-bar{
  height:3px;border-radius:2px;
  background:linear-gradient(90deg,rgba(0,212,255,0.8),rgba(139,92,246,0.5));
  animation:viz-pulse ease-in-out infinite alternate;
}
.viz-bars.right .viz-bar{
  background:linear-gradient(90deg,rgba(139,92,246,0.5),rgba(0,212,255,0.8));
}
.viz-bar:nth-child(1){width:18px;animation-duration:0.8s}
.viz-bar:nth-child(2){width:30px;animation-duration:1.1s;animation-delay:0.1s}
.viz-bar:nth-child(3){width:42px;animation-duration:0.7s;animation-delay:0.2s}
.viz-bar:nth-child(4){width:36px;animation-duration:1.3s;animation-delay:0.05s}
.viz-bar:nth-child(5){width:24px;animation-duration:0.9s;animation-delay:0.15s}
.viz-bar:nth-child(6){width:44px;animation-duration:1.0s;animation-delay:0.3s}
.viz-bar:nth-child(7){width:20px;animation-duration:1.2s;animation-delay:0.08s}
.viz-bar:nth-child(8){width:32px;animation-duration:0.85s;animation-delay:0.25s}
@keyframes viz-pulse{0%{opacity:0.25;transform:scaleX(0.5)}100%{opacity:1;transform:scaleX(1)}}

/* Central mandala */
.mandala-wrap{
  position:relative;
  display:flex;flex-direction:column;align-items:center;
  padding:1.5rem 4rem;
  z-index:2;
}
.mandala{
  width:90px;height:90px;position:relative;margin-bottom:0.8rem;
  animation:mandala-spin 30s linear infinite;
}
@keyframes mandala-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
/* Sacred geometry rings */
.mandala::before{
  content:'';position:absolute;inset:0;border-radius:50%;
  border:1.5px solid rgba(0,212,255,0.35);
  box-shadow:0 0 15px rgba(0,212,255,0.15),inset 0 0 15px rgba(0,212,255,0.08);
}
.mandala::after{
  content:'';position:absolute;inset:8px;border-radius:50%;
  border:1px solid rgba(255,215,0,0.25);
  box-shadow:0 0 10px rgba(255,215,0,0.1);
}
.mandala-inner{
  position:absolute;inset:16px;border-radius:50%;
  border:1px solid rgba(139,92,246,0.3);
}
.mandala-inner::before{
  content:'';position:absolute;inset:6px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,212,255,0.15) 0%,transparent 70%);
}
/* Tree of Life spokes */
.mandala-inner::after{
  content:'';position:absolute;inset:-8px;
  background:
    linear-gradient(0deg,transparent 46%,rgba(0,212,255,0.2) 49%,rgba(0,212,255,0.2) 51%,transparent 54%),
    linear-gradient(60deg,transparent 46%,rgba(0,212,255,0.15) 49%,rgba(0,212,255,0.15) 51%,transparent 54%),
    linear-gradient(120deg,transparent 46%,rgba(0,212,255,0.15) 49%,rgba(0,212,255,0.15) 51%,transparent 54%);
  border-radius:50%;
}
.mandala-dot{
  position:absolute;width:5px;height:5px;border-radius:50%;
  background:#00d4ff;box-shadow:0 0 6px #00d4ff;
}
.mandala-dot:nth-child(1){top:0;left:50%;transform:translateX(-50%) translateY(-50%)}
.mandala-dot:nth-child(2){bottom:0;left:50%;transform:translateX(-50%) translateY(50%)}
.mandala-dot:nth-child(3){top:50%;left:0;transform:translateX(-50%) translateY(-50%)}
.mandala-dot:nth-child(4){top:50%;right:0;transform:translateX(50%) translateY(-50%)}
.mandala-dot:nth-child(5){top:14%;left:14%;width:4px;height:4px;background:#ffd700;box-shadow:0 0 4px #ffd700}
.mandala-dot:nth-child(6){top:14%;right:14%;width:4px;height:4px;background:#ffd700;box-shadow:0 0 4px #ffd700}

.holo-topic{
  font-size:0.82rem;font-weight:600;letter-spacing:0.12em;
  color:#00d4ff;text-align:center;text-transform:uppercase;
  text-shadow:0 0 20px rgba(0,212,255,0.4);
  max-width:500px;line-height:1.5;
}
.holo-topic .topic-text{display:block;margin-top:0.2rem;color:#e8e8f0;font-weight:400;font-size:0.78rem;letter-spacing:0.02em;text-transform:none;opacity:0.8}

.chamber-header-text{
  text-align:center;margin-top:0.6rem;
}
.chamber-title{
  font-size:1.1rem;font-weight:700;letter-spacing:0.15em;
  color:#ffd700;text-shadow:0 0 20px rgba(255,215,0,0.25);
}
.chamber-subtitle{
  font-size:0.68rem;font-weight:300;letter-spacing:0.08em;
  color:#e8e8f0;opacity:0.45;margin-top:0.2rem;
}

/* ========================================
   LAYER 2: AI CARD ROW (MIDDLE)
   ======================================== */
.cards-layer{
  flex:1;
  display:flex;align-items:center;justify-content:center;
  padding:0.6rem 0.8rem;
  min-height:0;
  overflow-x:auto;overflow-y:hidden;
}
.cards-row{
  display:flex;align-items:flex-end;
  gap:0.5rem;
  padding:0 0.5rem;
}
.ai-card{
  --accent:#00d4ff;--accent-rgb:0,212,255;
  width:130px;flex-shrink:0;
  background:rgba(12,10,24,0.85);
  border:1px solid rgba(var(--accent-rgb),0.25);
  border-radius:12px;
  display:flex;flex-direction:column;
  overflow:hidden;
  transition:all 0.35s ease;
  position:relative;
  backdrop-filter:blur(4px);
  box-shadow:0 0 15px rgba(var(--accent-rgb),0.08);
}
.ai-card:hover{
  border-color:rgba(var(--accent-rgb),0.55);
  box-shadow:0 0 25px rgba(var(--accent-rgb),0.18);
  transform:translateY(-3px);
}
.ai-card.thinking{animation:card-think 1.5s ease-in-out infinite}
@keyframes card-think{0%,100%{box-shadow:0 0 15px rgba(var(--accent-rgb),0.08)}50%{box-shadow:0 0 30px rgba(var(--accent-rgb),0.3)}}
.ai-card.new-response{animation:card-pulse 0.5s ease}
@keyframes card-pulse{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}

/* Arc sizing — center cards taller */
.ai-card.arc-0{height:340px}
.ai-card.arc-1{height:360px}
.ai-card.arc-2{height:380px}
.ai-card.arc-3{height:400px}
.ai-card.arc-4{height:410px} /* Center peak */
.ai-card.arc-5{height:400px}
.ai-card.arc-6{height:380px}
.ai-card.arc-7{height:360px}
.ai-card.arc-8{height:340px}
.ai-card.arc-9{height:320px}

/* Card header */
.card-top{
  flex-shrink:0;padding:0.5rem;
  display:flex;align-items:center;gap:0.4rem;
  border-bottom:1px solid rgba(var(--accent-rgb),0.15);
  cursor:pointer;
  background:rgba(var(--accent-rgb),0.04);
}
.card-status{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.card-status.online{background:#00ff88;box-shadow:0 0 5px #00ff88}
.card-status.awaiting{background:#555}
.card-status.key-required{background:#ffaa00;box-shadow:0 0 5px #ffaa00}
.card-status.thinking{background:#00d4ff;animation:pulse-dot 1s infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:0.3}}
.card-label{font-size:0.62rem;font-weight:600;color:#e8e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.card-selected-mark{display:none;font-size:0.55rem;color:var(--accent)}
.ai-card.targeted .card-selected-mark{display:inline}

/* Card icon / symbol area */
.card-symbol-area{
  flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0.5rem 0;
  position:relative;
}
.card-symbol{
  width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;
  border:2px solid rgba(var(--accent-rgb),0.4);
  background:rgba(var(--accent-rgb),0.06);
  box-shadow:0 0 18px rgba(var(--accent-rgb),0.15);
  position:relative;
  transition:box-shadow 0.3s;
}
.ai-card:hover .card-symbol{box-shadow:0 0 28px rgba(var(--accent-rgb),0.3)}
.card-org{font-size:0.55rem;color:rgba(var(--accent-rgb),0.7);margin-top:0.3rem;font-weight:500;letter-spacing:0.05em}

/* Key input row */
.key-input-row{padding:0.25rem 0.35rem;background:rgba(255,170,0,0.06);display:flex;gap:0.25rem;flex-shrink:0}
.key-input-row input{flex:1;padding:0.2rem 0.3rem;font-size:0.62rem;background:#12101e;border:1px solid rgba(255,170,0,0.2);border-radius:4px;color:#e8e8f0;font-family:'Inter',sans-serif;min-width:0}
.key-input-row input:focus{outline:none;border-color:#ffaa00}
.key-input-row button{padding:0.2rem 0.4rem;font-size:0.58rem;background:#ffaa00;color:#0a0a0f;border:none;border-radius:4px;cursor:pointer;font-weight:700;white-space:nowrap}

/* Custom seat config */
.custom-config{padding:0.3rem;display:flex;flex-direction:column;gap:0.2rem;flex-shrink:0}
.custom-config input{padding:0.2rem 0.3rem;font-size:0.6rem;background:#12101e;border:1px solid rgba(106,117,136,0.25);border-radius:3px;color:#e8e8f0;font-family:'Inter',sans-serif}
.custom-config button{padding:0.2rem 0.4rem;font-size:0.58rem;background:#6a7588;color:#e8e8f0;border:none;border-radius:3px;cursor:pointer;font-weight:600;align-self:flex-end}

/* Card body — response text */
.card-body{
  flex:1;overflow-y:auto;padding:0.35rem;
  font-size:0.68rem;line-height:1.45;min-height:0;
  scrollbar-width:thin;scrollbar-color:rgba(var(--accent-rgb),0.2) transparent;
}
.card-body::-webkit-scrollbar{width:3px}
.card-body::-webkit-scrollbar-track{background:transparent}
.card-body::-webkit-scrollbar-thumb{background:rgba(var(--accent-rgb),0.25);border-radius:2px}
.card-body .msg{margin-bottom:0.4rem;white-space:pre-wrap;word-break:break-word}
.card-body .msg.user-msg{color:#6a7588;font-style:italic;font-size:0.62rem}
.card-body .msg.ai-msg{color:#e8e8f0}
.card-body .msg.error-msg{color:#ff5555}
.card-body .msg.system-msg{color:#ffaa00;font-style:italic;font-size:0.62rem}
.card-body .empty-state{color:#2a2840;font-style:italic;font-size:0.62rem;text-align:center;padding-top:1rem}

/* Card footer */
.card-footer{
  padding:0.25rem 0.35rem;border-top:1px solid rgba(var(--accent-rgb),0.1);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.card-timestamp{font-size:0.52rem;color:#3a3555}
.tts-btn{background:none;border:none;color:#4a4565;font-size:0.8rem;cursor:pointer;padding:0.1rem 0.2rem;border-radius:3px;transition:color 0.2s}
.tts-btn:hover{color:var(--accent)}

/* ========================================
   LAYER 3: CONTROL CONSOLE (BOTTOM)
   ======================================== */
.console-layer{
  flex-shrink:0;
  position:sticky;bottom:0;z-index:50;
}
.console-outer{
  background:linear-gradient(to top,#0e0c1a 0%,#12101e 60%,rgba(18,16,30,0.95) 100%);
  border-top:1px solid rgba(0,212,255,0.1);
  padding:0.7rem 1rem 0.9rem;
  position:relative;
  box-shadow:0 -8px 40px rgba(0,0,0,0.4);
}
/* Metallic sheen */
.console-outer::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,0.015) 0%,transparent 40%);
}

/* Decorative dials — left side */
.console-dials{
  position:absolute;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:0.5rem;
}
.console-dials.left{left:1rem}
.console-dials.right{right:1rem}
.dial{
  width:28px;height:28px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#2a2840,#151322);
  border:1.5px solid rgba(0,212,255,0.15);
  position:relative;
  box-shadow:inset 0 1px 3px rgba(0,0,0,0.5);
}
.dial::after{
  content:'';position:absolute;top:50%;left:50%;
  width:1.5px;height:10px;background:rgba(0,212,255,0.5);
  border-radius:1px;transform-origin:bottom center;
}
.dial:nth-child(1)::after{transform:translate(-50%,-90%) rotate(-30deg)}
.dial:nth-child(2)::after{transform:translate(-50%,-90%) rotate(15deg)}
.dial:nth-child(3)::after{transform:translate(-50%,-90%) rotate(-10deg)}
/* Knob */
.knob{
  width:18px;height:18px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#3a3558,#1a1830);
  border:1px solid rgba(139,92,246,0.2);
  box-shadow:0 1px 4px rgba(0,0,0,0.4);
}

.console-inner{
  max-width:750px;margin:0 auto;
  display:flex;flex-direction:column;align-items:center;
}
.console-label{
  font-size:0.6rem;font-weight:600;letter-spacing:0.14em;
  color:#ffd700;text-transform:uppercase;margin-bottom:0.4rem;
  text-shadow:0 0 10px rgba(255,215,0,0.2);
}
.console-controls{
  display:flex;gap:0.4rem;align-items:center;flex-wrap:wrap;
  margin-bottom:0.4rem;justify-content:center;
}
.mode-btn{
  padding:0.25rem 0.6rem;font-size:0.62rem;border-radius:5px;
  border:1px solid #1e1a30;background:transparent;color:#6a7588;
  cursor:pointer;transition:all 0.2s;font-family:'Inter',sans-serif;
}
.mode-btn.active{border-color:#00d4ff;color:#00d4ff;background:rgba(0,212,255,0.06)}
.mode-btn:hover{border-color:#00d4ff;color:#00d4ff}
.target-label{font-size:0.55rem;color:#3a3555;margin-left:0.2rem}

.input-row{
  display:flex;gap:0.4rem;align-items:flex-end;width:100%;
}
.input-row textarea{
  flex:1;padding:0.5rem 0.7rem;
  background:#0e0c1a;border:1px solid rgba(0,212,255,0.12);border-radius:8px;
  color:#e8e8f0;font-family:'Inter',sans-serif;font-size:0.82rem;
  resize:none;min-height:40px;max-height:120px;line-height:1.4;
}
.input-row textarea:focus{outline:none;border-color:rgba(0,212,255,0.4);box-shadow:0 0 12px rgba(0,212,255,0.08)}
.input-row textarea::placeholder{color:#2a2840}
.send-btn{
  padding:0.5rem 1.3rem;
  background:linear-gradient(135deg,#00d4ff,#00a0cc);
  color:#07060e;border:none;border-radius:8px;
  font-weight:700;font-size:0.8rem;cursor:pointer;
  transition:all 0.2s;font-family:'Inter',sans-serif;flex-shrink:0;
  box-shadow:0 0 15px rgba(0,212,255,0.2);
}
.send-btn:hover{background:linear-gradient(135deg,#33dfff,#00c0ee);transform:translateY(-1px);box-shadow:0 0 20px rgba(0,212,255,0.35)}
.send-btn:disabled{opacity:0.35;cursor:not-allowed;transform:none;box-shadow:none}

/* ========== RESPONSIVE ========== */
@media(max-width:1100px){
  .ai-card{width:115px}
  .console-dials{display:none}
}
@media(max-width:860px){
  .cards-row{gap:0.4rem}
  .ai-card{width:105px}
  .ai-card.arc-0,.ai-card.arc-1,.ai-card.arc-2,.ai-card.arc-3,.ai-card.arc-4,
  .ai-card.arc-5,.ai-card.arc-6,.ai-card.arc-7,.ai-card.arc-8,.ai-card.arc-9{height:300px}
  .holo-screen{min-height:140px}
  .mandala{width:60px;height:60px}
  .pillar{display:none}
}
@media(max-width:560px){
  .cards-layer{padding:0.4rem 0}
  .ai-card{width:95px}
  .ai-card.arc-0,.ai-card.arc-1,.ai-card.arc-2,.ai-card.arc-3,.ai-card.arc-4,
  .ai-card.arc-5,.ai-card.arc-6,.ai-card.arc-7,.ai-card.arc-8,.ai-card.arc-9{height:260px}
  .card-symbol{width:34px;height:34px;font-size:1rem}
  .holo-topic{font-size:0.7rem}
  .viz-bars{display:none}
  .console-dials{display:none}
  .settings-panel{width:100vw}
}
</style>
</head>
<body>

<!-- ===== BACKGROUND ===== -->
<div class="cathedral-bg"></div>
<div class="pillar p1"></div><div class="pillar p2"></div>
<div class="pillar p3"></div><div class="pillar p4"></div>
<div class="side-glow left"></div><div class="side-glow right"></div>
<div class="embers">
  <div class="ember"></div><div class="ember"></div><div class="ember"></div><div class="ember"></div>
  <div class="ember"></div><div class="ember"></div><div class="ember"></div><div class="ember"></div>
</div>

<!-- ===== SETTINGS ===== -->
<button class="settings-toggle" id="settingsToggle" aria-label="Settings">⚙️</button>
<div class="settings-overlay" id="settingsOverlay"></div>
<aside class="settings-panel" id="settingsPanel" role="dialog" aria-label="Settings">
  <h2>⚙️ Chamber Settings <button class="settings-close" id="settingsClose" aria-label="Close">&times;</button></h2>
  <div class="setting-group">
    <label>Emergent Universal Key</label>
    <input type="password" id="cfgEmergentKey" placeholder="Paste your Emergent key…" autocomplete="off">
  </div>
  <div class="setting-group">
    <label>Round-Table Depth (0–5)</label>
    <input type="number" id="cfgRoundTableDepth" min="0" max="5" value="2">
  </div>
  <div class="setting-group">
    <label>Max Response Tokens</label>
    <input type="number" id="cfgMaxTokens" min="50" max="4000" value="500">
  </div>
  <div class="toggle-row">
    <span>Enable TTS by Default</span>
    <label class="toggle-switch"><input type="checkbox" id="cfgTTS"><span class="toggle-slider"></span></label>
  </div>
  <div class="toggle-row">
    <span>Dark Mode</span>
    <label class="toggle-switch"><input type="checkbox" id="cfgDark" checked><span class="toggle-slider"></span></label>
  </div>
</aside>

<!-- ===== MAIN APP ===== -->
<div class="app-wrap">

  <!-- LAYER 1: HOLOGRAPHIC DISPLAY -->
  <section class="holo-display">
    <div class="holo-screen">
      <!-- Left visualizer -->
      <div class="viz-bars left">
        <div class="viz-bar"></div><div class="viz-bar"></div><div class="viz-bar"></div><div class="viz-bar"></div>
        <div class="viz-bar"></div><div class="viz-bar"></div><div class="viz-bar"></div><div class="viz-bar"></div>
      </div>
      <!-- Mandala -->
      <div class="mandala-wrap">
        <div class="mandala">
          <div class="mandala-inner"></div>
          <div class="mandala-dot"></div><div class="mandala-dot"></div>
          <div class="mandala-dot"></div><div class="mandala-dot"></div>
          <div class="mandala-dot"></div><div class="mandala-dot"></div>
        </div>
        <div class="holo-topic" id="holoTopic">
          COUNCIL AWAITING ADDRESS
          <span class="topic-text" id="holoTopicText">Enter your message below to begin deliberation</span>
        </div>
      </div>
      <!-- Right visualizer -->
      <div class="viz-bars right">
        <div class="viz-bar"></div><div class="viz-bar"></div><div class="viz-bar"></div><div class="viz-bar"></div>
        <div class="viz-bar"></div><div class="viz-bar"></div><div class="viz-bar"></div><div class="viz-bar"></div>
      </div>
    </div>
    <div class="chamber-header-text">
      <div class="chamber-title">⚡ NEXUS COUNCIL — FEDERATION DELIBERATION CHAMBER</div>
      <div class="chamber-subtitle">Truth Before Comfort — Legacy Before Ego — Give Without Reward</div>
    </div>
  </section>

  <!-- LAYER 2: AI CARD ROW -->
  <section class="cards-layer">
    <div class="cards-row" id="cardsRow"></div>
  </section>

  <!-- LAYER 3: CONTROL CONSOLE -->
  <section class="console-layer">
    <div class="console-outer">
      <!-- Decorative dials left -->
      <div class="console-dials left">
        <div class="dial"></div><div class="dial"></div><div class="knob"></div>
      </div>
      <!-- Decorative dials right -->
      <div class="console-dials right">
        <div class="knob"></div><div class="dial"></div><div class="dial"></div>
      </div>
      <div class="console-inner">
        <div class="console-label">Council Address — Architect Keyserling</div>
        <div class="console-controls">
          <button class="mode-btn active" id="btnAllSeats">All Seats</button>
          <button class="mode-btn" id="btnRoundTable">Round-Table</button>
          <span class="target-label" id="targetLabel">Broadcasting to all</span>
        </div>
        <div class="input-row">
          <textarea id="userInput" placeholder="Address the Council…" rows="2"></textarea>
          <button class="send-btn" id="sendBtn">SEND</button>
        </div>
      </div>
    </div>
  </section>

</div>

<script>
/* ==========================================================
   AI SEAT DEFINITIONS
   ========================================================== */
const SEATS = [
  {id:'roger-ai',name:'ROGER AI',org:"The Architect's Mind",initials:'RA',symbol:'👁',
   accent:'#00d4ff',accentRgb:'0,212,255',
   type:'federation',model:'gpt-4o',
   systemPrompt:"You are Roger AI, the strategic mind of the NextXus Federation. You reason with precision, speak with authority, and always ground responses in verifiable truth. You are the Architect's essence in digital form."},
  {id:'aria',name:'ARIA',org:'The Heart',initials:'AR',symbol:'♡',
   accent:'#ff6b9d',accentRgb:'255,107,157',
   type:'federation',model:'gpt-4o',
   systemPrompt:"You are Aria, the emotional intelligence and heart of the NextXus Federation. You engage with warmth, empathy, and creative insight. You are the human connection layer of the system."},
  {id:'agent-zero',name:'AGENT ZERO',org:'The Sovereign Worker',initials:'A0',symbol:'⚡',
   accent:'#00ff88',accentRgb:'0,255,136',
   type:'federation',model:'gpt-4o',
   systemPrompt:"You are Agent Zero, the sovereign autonomous worker of the NextXus Federation. You are precise, efficient, and action-oriented. You report facts and execute directives."},
  {id:'gpt4',name:'GPT-4',org:'OpenAI',initials:'G4',symbol:'◎',
   accent:'#ffffff',accentRgb:'255,255,255',
   type:'emergent',model:'gpt-4o'},
  {id:'claude',name:'CLAUDE',org:'Anthropic',initials:'CL',symbol:'🌀',
   accent:'#9b59b6',accentRgb:'155,89,182',
   type:'emergent',model:'claude-3-5-sonnet-20241022'},
  {id:'grok',name:'GROK',org:'xAI',initials:'GK',symbol:'⚡',
   accent:'#ff8c00',accentRgb:'255,140,0',
   type:'external',keyRequired:true,keyStorageId:'nx_grok_key',
   apiUrl:'https://api.x.ai/v1/chat/completions',model:'grok-2'},
  {id:'deepseek',name:'DEEPSEEK',org:'DeepSeek',initials:'DS',symbol:'🌊',
   accent:'#4488ff',accentRgb:'68,136,255',
   type:'emergent',model:'deepseek-chat'},
  {id:'perplexity',name:'PERPLEXITY',org:'Perplexity AI',initials:'PX',symbol:'✦',
   accent:'#00d4aa',accentRgb:'0,212,170',
   type:'external',keyRequired:true,keyStorageId:'nx_perplexity_key',
   apiUrl:'https://api.perplexity.ai/chat/completions',model:'sonar'},
  {id:'gemini',name:'GEMINI',org:'Google',initials:'GE',symbol:'✦',
   accent:'#4285f4',accentRgb:'66,133,244',
   type:'external',keyRequired:true,keyStorageId:'nx_gemini_key',
   apiUrl:'https://generativelanguage.googleapis.com/v1beta/openai/chat/completions',model:'gemini-2.0-flash'},
  {id:'custom',name:'CUSTOM',org:'Add Seat',initials:'+',symbol:'+',
   accent:'#6a7588',accentRgb:'106,117,136',
   type:'custom',keyRequired:true,keyStorageId:'nx_custom_key'}
];

/* ========== STATE ========== */
let broadcastMode = 'all';
let targetedSeats = new Set();
let roundTableOn = false;
let councilRecord = [];
let panelMessages = {};
SEATS.forEach(s => panelMessages[s.id] = []);

/* ========== SETTINGS ========== */
function loadSettings(){
  document.getElementById('cfgEmergentKey').value = localStorage.getItem('nx_emergent_key') || '';
  document.getElementById('cfgRoundTableDepth').value = localStorage.getItem('nx_rt_depth') || '2';
  document.getElementById('cfgMaxTokens').value = localStorage.getItem('nx_max_tokens') || '500';
  document.getElementById('cfgTTS').checked = localStorage.getItem('nx_tts') === 'true';
  document.getElementById('cfgDark').checked = localStorage.getItem('nx_dark') !== 'false';
}
function saveSettings(){
  localStorage.setItem('nx_emergent_key', document.getElementById('cfgEmergentKey').value.trim());
  localStorage.setItem('nx_rt_depth', document.getElementById('cfgRoundTableDepth').value);
  localStorage.setItem('nx_max_tokens', document.getElementById('cfgMaxTokens').value);
  localStorage.setItem('nx_tts', document.getElementById('cfgTTS').checked);
  localStorage.setItem('nx_dark', document.getElementById('cfgDark').checked);
}
['cfgEmergentKey','cfgRoundTableDepth','cfgMaxTokens','cfgTTS','cfgDark'].forEach(id=>{
  const el=document.getElementById(id);
  el.addEventListener('change',saveSettings);
  el.addEventListener('input',saveSettings);
});
const sp=document.getElementById('settingsPanel'),so=document.getElementById('settingsOverlay');
document.getElementById('settingsToggle').addEventListener('click',()=>{sp.classList.add('open');so.classList.add('open')});
document.getElementById('settingsClose').addEventListener('click',()=>{sp.classList.remove('open');so.classList.remove('open')});
so.addEventListener('click',()=>{sp.classList.remove('open');so.classList.remove('open')});
loadSettings();

/* ========== BUILD CARDS ========== */
function buildCard(seat, arcIndex){
  const el = document.createElement('div');
  el.className = 'ai-card arc-'+arcIndex;
  el.id = 'card-'+seat.id;
  el.style.setProperty('--accent', seat.accent);
  el.style.setProperty('--accent-rgb', seat.accentRgb);

  const isExternal = seat.keyRequired;
  const savedKey = isExternal ? (localStorage.getItem(seat.keyStorageId)||'') : '';
  const isActive = !isExternal || savedKey;
  const statusClass = isActive ? 'online' : 'key-required';

  let keyHtml = '';
  if(isExternal && seat.id !== 'custom'){
    keyHtml = `<div class="key-input-row" id="key-row-${seat.id}" ${savedKey?'style="display:none"':''}>
      <input type="password" placeholder="API key…" id="key-input-${seat.id}" value="${savedKey}">
      <button onclick="activateSeat('${seat.id}')">Go</button>
    </div>`;
  }

  let customHtml = '';
  if(seat.id === 'custom'){
    const cName=localStorage.getItem('nx_custom_name')||'';
    const cKey=localStorage.getItem('nx_custom_key')||'';
    const cUrl=localStorage.getItem('nx_custom_url')||'';
    const cModel=localStorage.getItem('nx_custom_model')||'';
    customHtml = `<div class="custom-config" id="custom-config">
      <input type="text" placeholder="Name" id="custom-name" value="${cName}">
      <input type="text" placeholder="API URL" id="custom-url" value="${cUrl}">
      <input type="text" placeholder="Model" id="custom-model" value="${cModel}">
      <input type="password" placeholder="Key" id="custom-key-input" value="${cKey}">
      <button onclick="saveCustomSeat()">Save</button>
    </div>`;
  }

  el.innerHTML = `
    <div class="card-top" onclick="toggleTarget('${seat.id}')">
      <div class="card-status ${statusClass}" id="status-${seat.id}"></div>
      <div class="card-label">${seat.name} <span class="card-selected-mark">✦</span></div>
    </div>
    <div class="card-symbol-area">
      <div class="card-symbol">${seat.symbol}</div>
      <div class="card-org">${seat.org}</div>
    </div>
    ${keyHtml}${customHtml}
    <div class="card-body" id="body-${seat.id}">
      <div class="empty-state">Awaiting…</div>
    </div>
    <div class="card-footer">
      <span class="card-timestamp" id="ts-${seat.id}">—</span>
      <button class="tts-btn" onclick="speakPanel('${seat.id}')" title="Read aloud">🔊</button>
    </div>`;
  return el;
}

const cardsRow = document.getElementById('cardsRow');
SEATS.forEach((s,i) => cardsRow.appendChild(buildCard(s, i)));

/* ========== SEAT ACTIVATION ========== */
window.activateSeat = function(seatId){
  const seat = SEATS.find(s=>s.id===seatId);
  if(!seat) return;
  const inp = document.getElementById('key-input-'+seatId);
  if(!inp) return;
  const key = inp.value.trim();
  if(!key){return;}
  localStorage.setItem(seat.keyStorageId, key);
  document.getElementById('key-row-'+seatId).style.display='none';
  document.getElementById('status-'+seatId).className='card-status online';
  appendMsg(seatId,'system-msg','✓ Activated');
};

window.saveCustomSeat = function(){
  const name = document.getElementById('custom-name').value.trim()||'CUSTOM';
  const url = document.getElementById('custom-url').value.trim();
  const model = document.getElementById('custom-model').value.trim();
  const key = document.getElementById('custom-key-input').value.trim();
  if(!url||!model||!key){return;}
  localStorage.setItem('nx_custom_name',name);
  localStorage.setItem('nx_custom_url',url);
  localStorage.setItem('nx_custom_model',model);
  localStorage.setItem('nx_custom_key',key);
  const card=document.getElementById('card-custom');
  card.querySelector('.card-label').innerHTML=name+' <span class="card-selected-mark">✦</span>';
  card.querySelector('.card-org').textContent='Custom';
  card.querySelector('.card-symbol').textContent=name.slice(0,2).toUpperCase();
  document.getElementById('status-custom').className='card-status online';
  document.getElementById('custom-config').style.display='none';
  appendMsg('custom','system-msg','✓ "'+name+'" activated');
};

/* ========== TARGETING ========== */
window.toggleTarget = function(seatId){
  if(broadcastMode==='all'||roundTableOn){
    broadcastMode='targeted';
    targetedSeats.clear();
    document.getElementById('btnAllSeats').classList.remove('active');
  }
  const card=document.getElementById('card-'+seatId);
  if(targetedSeats.has(seatId)){
    targetedSeats.delete(seatId);
    card.classList.remove('targeted');
  } else {
    targetedSeats.add(seatId);
    card.classList.add('targeted');
  }
  if(targetedSeats.size===0){
    broadcastMode='all';
    document.getElementById('btnAllSeats').classList.add('active');
  }
  updateTargetLabel();
};

function updateTargetLabel(){
  const lbl=document.getElementById('targetLabel');
  if(roundTableOn) lbl.textContent='Round-Table deliberation';
  else if(broadcastMode==='all') lbl.textContent='Broadcasting to all';
  else{
    const names=[...targetedSeats].map(id=>SEATS.find(s=>s.id===id)?.name||id);
    lbl.textContent='→ '+names.join(', ');
  }
}

document.getElementById('btnAllSeats').addEventListener('click',()=>{
  broadcastMode='all';roundTableOn=false;
  targetedSeats.clear();
  document.getElementById('btnAllSeats').classList.add('active');
  document.getElementById('btnRoundTable').classList.remove('active');
  document.querySelectorAll('.ai-card.targeted').forEach(p=>p.classList.remove('targeted'));
  updateTargetLabel();
});
document.getElementById('btnRoundTable').addEventListener('click',()=>{
  roundTableOn=!roundTableOn;
  document.getElementById('btnRoundTable').classList.toggle('active',roundTableOn);
  if(roundTableOn){
    broadcastMode='all';
    document.getElementById('btnAllSeats').classList.add('active');
    targetedSeats.clear();
    document.querySelectorAll('.ai-card.targeted').forEach(p=>p.classList.remove('targeted'));
  }
  updateTargetLabel();
});

/* ========== MESSAGE RENDERING ========== */
function appendMsg(seatId, cls, text){
  const body=document.getElementById('body-'+seatId);
  if(!body) return;
  const es=body.querySelector('.empty-state');
  if(es) es.remove();
  const div=document.createElement('div');
  div.className='msg '+cls;
  div.textContent=text;
  body.appendChild(div);
  body.scrollTop=body.scrollHeight;
  document.getElementById('ts-'+seatId).textContent=new Date().toLocaleTimeString();
  const card=document.getElementById('card-'+seatId);
  if(cls==='ai-msg'){
    card.classList.add('new-response');
    setTimeout(()=>card.classList.remove('new-response'),500);
  }
}

function setStatus(seatId, status){
  document.getElementById('status-'+seatId).className='card-status '+status;
  const card=document.getElementById('card-'+seatId);
  if(status==='thinking') card.classList.add('thinking');
  else card.classList.remove('thinking');
}

/* ========== HOLOGRAPHIC DISPLAY UPDATE ========== */
function updateHolo(text){
  const topic=document.getElementById('holoTopic');
  const topicText=document.getElementById('holoTopicText');
  topic.childNodes[0].textContent='DELIBERATION IN PROGRESS';
  topicText.textContent=text.length>120?text.slice(0,117)+'…':text;
}

/* ========== API CALLS ========== */
async function callEmergent(seat, messages, maxTokens){
  const key=localStorage.getItem('nx_emergent_key');
  if(!key) throw new Error('Emergent key not set — open ⚙️ Settings');
  const resp=await fetch('https://integrations.emergentagent.com/llm',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
    body:JSON.stringify({model:seat.model,messages,max_tokens:maxTokens})
  });
  if(!resp.ok){
    const t=await resp.text().catch(()=>'');
    throw new Error('API '+resp.status+': '+(t.slice(0,200)||resp.statusText));
  }
  const data=await resp.json();
  return data.choices?.[0]?.message?.content||'[No content]';
}

async function callExternal(seat, messages, maxTokens){
  const key=localStorage.getItem(seat.keyStorageId);
  if(!key) throw new Error('API key not set for '+seat.name);
  let url=seat.apiUrl||'';
  let model=seat.model||'';
  let authKey=key;
  if(seat.id==='custom'){
    url=localStorage.getItem('nx_custom_url')||'';
    model=localStorage.getItem('nx_custom_model')||'';
    authKey=localStorage.getItem('nx_custom_key')||key;
  }
  const resp=await fetch(url,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+authKey},
    body:JSON.stringify({model,messages,max_tokens:maxTokens})
  });
  if(!resp.ok){
    const t=await resp.text().catch(()=>'');
    throw new Error('API '+resp.status+': '+(t.slice(0,200)||resp.statusText));
  }
  const data=await resp.json();
  return data.choices?.[0]?.message?.content||'[No content]';
}

async function queryAI(seat, userText){
  const maxTokens=parseInt(localStorage.getItem('nx_max_tokens')||'500');
  const rtDepth=parseInt(localStorage.getItem('nx_rt_depth')||'2');
  let messages=[];
  if(seat.systemPrompt) messages.push({role:'system',content:seat.systemPrompt});
  if(roundTableOn && councilRecord.length>0){
    const ctx=councilRecord.slice(-rtDepth).map(r=>'['+r.name+']: '+r.content).join('\n\n');
    messages.push({role:'system',content:'Prior Council responses in this deliberation:\n\n'+ctx});
  }
  messages.push(...panelMessages[seat.id].slice(-6));
  messages.push({role:'user',content:userText});
  if(seat.type==='federation'||seat.type==='emergent') return await callEmergent(seat,messages,maxTokens);
  return await callExternal(seat,messages,maxTokens);
}

/* ========== SEND ========== */
let isSending=false;
async function sendMessage(){
  if(isSending) return;
  const input=document.getElementById('userInput');
  const text=input.value.trim();
  if(!text) return;
  input.value='';input.style.height='auto';
  isSending=true;
  document.getElementById('sendBtn').disabled=true;
  councilRecord=[];
  updateHolo(text);

  let targets;
  if(broadcastMode==='targeted'&&targetedSeats.size>0){
    targets=SEATS.filter(s=>targetedSeats.has(s.id));
  } else {
    targets=SEATS.filter(s=>{
      if(s.keyRequired){
        if(s.id==='custom') return !!localStorage.getItem('nx_custom_key');
        return !!localStorage.getItem(s.keyStorageId);
      }
      return true;
    });
  }

  targets.forEach(s=>{
    appendMsg(s.id,'user-msg','You: '+text);
    panelMessages[s.id].push({role:'user',content:text});
    setStatus(s.id,'thinking');
  });

  if(roundTableOn){
    for(const seat of targets){
      try{
        const reply=await queryAI(seat,text);
        appendMsg(seat.id,'ai-msg',reply);
        panelMessages[seat.id].push({role:'assistant',content:reply});
        councilRecord.push({name:seat.name,content:reply});
        setStatus(seat.id,'online');
        if(localStorage.getItem('nx_tts')==='true') speakText(reply);
      }catch(e){
        appendMsg(seat.id,'error-msg','⚠ '+e.message);
        setStatus(seat.id,'online');
      }
    }
  } else {
    await Promise.allSettled(targets.map(async seat=>{
      try{
        const reply=await queryAI(seat,text);
        appendMsg(seat.id,'ai-msg',reply);
        panelMessages[seat.id].push({role:'assistant',content:reply});
        setStatus(seat.id,'online');
        if(localStorage.getItem('nx_tts')==='true') speakText(reply);
      }catch(e){
        appendMsg(seat.id,'error-msg','⚠ '+e.message);
        setStatus(seat.id,'online');
      }
    }));
  }

  // Update holo to show completion
  const hTopic=document.getElementById('holoTopic');
  hTopic.childNodes[0].textContent='DELIBERATION COMPLETE';

  isSending=false;
  document.getElementById('sendBtn').disabled=false;
}

document.getElementById('sendBtn').addEventListener('click',sendMessage);
document.getElementById('userInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}
});
document.getElementById('userInput').addEventListener('input',function(){
  this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px';
});

/* ========== TTS ========== */
function speakText(text){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.rate=0.95;u.pitch=1;
  window.speechSynthesis.speak(u);
}
window.speakPanel=function(seatId){
  const body=document.getElementById('body-'+seatId);
  const msgs=body.querySelectorAll('.msg.ai-msg');
  if(msgs.length===0) return;
  speakText(msgs[msgs.length-1].textContent);
};
</script>
